{% extends "base.html" %}

{% block title %}Register Account — AI Smart Civic Services{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto 0;">
  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="font-family: var(--font-display); font-size: 1.75rem; margin-bottom: 0.5rem;">Citizen Registration</h2>
      <p style="color: var(--text-secondary); font-size: 0.95rem;">Join your smart city portal to file issues and track fixes.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') if 'auth.register' in config else '/register' }}">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="Jane Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="jane@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="At least 8 characters" required>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">Create Citizen Account</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
      Already have an account? <a href="{{ url_for('auth.login') if 'auth.login' in config else '/login' }}">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
