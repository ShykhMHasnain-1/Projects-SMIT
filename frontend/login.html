{% extends "base.html" %}

{% block title %}Sign In — AI Smart Civic Services{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto 0;">
  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="font-family: var(--font-display); font-size: 1.75rem; margin-bottom: 0.5rem;">Sign In</h2>
      <p style="color: var(--text-secondary); font-size: 0.95rem;">Access the Citizen or Municipal Admin Portal</p>
    </div>

    <!-- Quick Demo Credentials Selector -->
    <div style="background: var(--bg-surface); padding: 0.85rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; text-align: center;">
      <div style="font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;">Quick Demo Fill</div>
      <div style="display: flex; gap: 0.5rem; justify-content: center;">
        <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('email').value='citizen@civic.gov'; document.getElementById('password').value='Password@123';">Citizen Demo</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('email').value='admin@civic.gov'; document.getElementById('password').value='Admin@123';">Admin Demo</button>
      </div>
    </div>

    <form method="POST" action="{{ url_for('auth.login') if 'auth.login' in config else '/login' }}">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@civic.gov" required>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label for="password" style="margin-bottom: 0;">Password</label>
          <a href="#" style="font-size: 0.85rem;" onclick="showToast('Password reset link sent to registered email.', 'info'); return false;">Forgot?</a>
        </div>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary w-full" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">Sign In</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
      Don't have an account? <a href="{{ url_for('auth.register') if 'auth.register' in config else '/register' }}">Register as a Citizen</a>
    </div>
  </div>
</div>
{% endblock %}
